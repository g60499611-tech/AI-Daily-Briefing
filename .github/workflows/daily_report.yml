name: 每日AI新闻推送

on:
  schedule:
    # 北京时间 20:00 = UTC 12:00
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      email:
        description: '收件人邮箱（可选，默认使用 Secrets 中的配置）'
        required: false
        type: string

jobs:
  daily-ai-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gh.txt

      - name: 执行AI新闻搜索与推送
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
        run: |
          EMAIL="${{ github.event.inputs.email || secrets.EMAIL_ACCOUNT }}"
          if [ -z "$EMAIL" ]; then
            echo "错误：未设置 EMAIL_ACCOUNT Secret 或未输入收件人邮箱。"
            exit 1
          fi
          python main.py --email "$EMAIL" --output index.html

      - name: 部署到 GitHub Pages
        run: |
          mkdir -p docs
          cp index.html docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: 更新AI每日简报 [$(date +'%Y-%m-%d')]"
          git push
